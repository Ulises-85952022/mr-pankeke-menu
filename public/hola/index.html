:root{color-scheme:dark;--fondo:#1f2023;--tarjeta:#2a2b2f;--tiza:#f4efe6;--gris:#b5afa6;--naranja:#f2a33a;--linea:rgba(244,239,230,.16)}

html,body{height:100%}
body{margin:0;background:var(--fondo);color:var(--tiza);font-family:"Bebas Neue","Oswald","Arial Narrow",system-ui,sans-serif;

.op.principal{background:var(--naranja);border-color:var(--naranja);color:#1f2023}
.op svg{width:34px;height:34px;flex:none}
.op b{display:block;font-weight:400;font-size:26px;letter-spacing:.04em;line-height:1}
.op span{display:block;font-family:system-ui,sans-serif;font-size:14.5px;line-height:1.35;margin-top:4px;opacity:.85}
.op:focus-visible{outline:3px solid var(--tiza);outline-offset:3px}
.op:active{transform:scale(.99)}
